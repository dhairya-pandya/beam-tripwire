[project]
name = "tripwire"
version = "0.1.0"
description = "Does a reasoning model cheat on coding tests, and does its reasoning say so?"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["apprentice", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tripwire = "tripwire.cli:app"

[tool.uv.sources]
apprentice = { path = "../BeamBuilds", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs Docker and local task data"]
addopts = "-m 'not docker'"
